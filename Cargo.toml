[workspace]
resolver = "3"
members = ["writer", "reader"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0"
repository = "https://github.com/datafarm-software/datafarm-iam"

[workspace.dependencies]
sqlx = { version = "0.9", default-features = false, features = ["postgres", "uuid", "chrono"] }
uuid = { version = "1", features = ["serde"] }
